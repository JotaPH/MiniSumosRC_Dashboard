<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniSumos RC · Arena</title>
<style>
:root{--cyan:#49eaff;--white:#f5fbff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#030914 url('/Fondo.jpg') center center/cover no-repeat fixed;color:var(--white);font-family:Impact,'Arial Black',system-ui,sans-serif}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,#02081455,#02081408 50%,#02081455),linear-gradient(0deg,#02081470,transparent 35%,#02081435);z-index:0}
#arena{position:relative;isolation:isolate;width:100%;height:100dvh;min-height:100vh;display:flex;flex-direction:column;padding:clamp(10px,1.7vh,22px) clamp(10px,2vw,32px)}
.status-wrap{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;min-height:clamp(42px,7vh,76px);padding:4px 0}
.status{font:1000 clamp(20px,3.3vw,48px)/1 Arial,Helvetica,sans-serif;letter-spacing:clamp(2px,.45vw,7px);text-align:center;text-transform:uppercase;color:#eaffff;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000,0 0 18px #00d9ffb5,0 0 38px #00aaff80}
.status.running{color:#75ffad;text-shadow:0 3px 0 #000,0 0 20px #00ff8c}.status.paused{color:#ffda65;text-shadow:0 3px 0 #000,0 0 20px #ffad00}.status.finished{color:#ff708b;text-shadow:0 3px 0 #000,0 0 20px #ff174d}.status.ready{color:#f4fbff}
.winner{position:relative;z-index:2;align-self:center;margin:0 0 8px;padding:10px 20px;background:#071324e8;border:2px solid #ffe56d;border-radius:14px;color:#ffe66d;font-size:clamp(18px,3vw,34px);text-align:center;-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:0 2px 0 #000,0 0 18px #ffe66d99}
.matchup{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,.62fr) minmax(0,1fr);align-items:center;gap:clamp(4px,1.7vw,28px);width:100%;margin:0 auto}
.combatant{height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;min-width:0}
.combatant:before{content:"";position:absolute;width:90%;height:38%;bottom:14%;border-radius:50%;filter:blur(36px);opacity:.4;z-index:-1;background:var(--robot-color,#00bfff)}
.robot-art{display:block;width:100%;height:min(58vh,620px);object-fit:contain;filter:drop-shadow(0 22px 32px #000d);animation:float 4.5s ease-in-out infinite;transition:filter .25s,transform .25s}.combatant.right .robot-art{animation-delay:-2.2s}
.robot-name{max-width:100%;margin-top:clamp(0px,.8vh,10px);font-size:clamp(32px,5.5vw,90px);line-height:.95;letter-spacing:clamp(1px,.25vw,5px);font-weight:1000;text-transform:uppercase;overflow-wrap:anywhere;color:var(--robot-color,#fff);-webkit-text-stroke:2.2px #05070b;paint-order:stroke fill;text-shadow:0 4px 0 #000,0 0 12px var(--robot-color,#fff),0 0 30px var(--robot-color,#fff)}
.attack-score{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.5vw,22px);margin-top:clamp(10px,2vh,25px);font-family:Arial,Helvetica,sans-serif;font-size:clamp(13px,1.3vw,19px);font-weight:1000;letter-spacing:clamp(1px,.25vw,4px);color:#fff;-webkit-text-stroke:.4px #000;text-shadow:0 2px 3px #000}
.attack-score strong{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(56px,8vw,124px);line-height:.82;letter-spacing:1px;color:var(--robot-color,#fff);-webkit-text-stroke:2.5px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000,0 0 12px var(--robot-color,#fff),0 0 28px var(--robot-color,#fff);font-variant-numeric:tabular-nums}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;text-align:center}
.vs{font-size:clamp(54px,8.5vw,130px);font-weight:1000;font-style:italic;line-height:.9;color:#fff;letter-spacing:-3px;-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000,0 0 18px #fff,0 0 42px #19cfff;margin-bottom:clamp(20px,4.5vh,58px);filter:drop-shadow(0 0 10px #00bfff);animation:pulse 3s ease-in-out infinite}
.timer-label{font:1000 clamp(10px,1.15vw,16px) Arial,sans-serif;letter-spacing:clamp(1px,.25vw,4px);color:#fff;-webkit-text-stroke:.5px #000;text-shadow:0 2px 3px #000;margin-bottom:12px}
.timer{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(44px,6.7vw,100px);font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000,0 0 18px #43dcff,0 0 36px #178cff;white-space:nowrap}
.gear{position:fixed;z-index:12;right:clamp(12px,1.6vw,24px);top:clamp(12px,1.6vw,24px);width:48px;height:48px;display:grid;place-items:center;border:1px solid #78dfffaa;border-radius:14px;background:#061525d9;color:white;font-size:24px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 20px #0008;transition:.2s}.gear:hover{border-color:var(--cyan);box-shadow:0 0 22px #32dfff55;transform:rotate(25deg)}
#settings{position:fixed;z-index:20;top:0;right:0;width:min(440px,100vw);height:100dvh;padding:22px;background:#04101bf7;border-left:1px solid #50dfff70;box-shadow:-20px 0 70px #0009;backdrop-filter:blur(18px);overflow:auto;transform:translateX(105%);transition:transform .3s ease;font-family:Arial,Helvetica,sans-serif}#settings.open{transform:translateX(0)}
.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.settings-head h2{font-size:20px;letter-spacing:2px;margin:0;color:#f2fbff}
.close{background:transparent;border:1px solid #43647f;border-radius:9px;color:white;font-size:23px;width:40px;height:40px;cursor:pointer}
.tabbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.tab{border:1px solid #31536f;border-radius:10px;background:#071a2c;color:#b5ccdf;font-size:12px;font-weight:900;letter-spacing:.5px;padding:13px 8px;cursor:pointer}.tab.active{background:linear-gradient(100deg,#19c9f4,#83f1ff);color:#03101a;border-color:transparent}
.panel-section[hidden]{display:none}.field-label{display:block;margin:17px 0 8px;font-size:11px;letter-spacing:1.5px;font-weight:900;color:#a9c5da;text-transform:uppercase}
input{width:100%;padding:13px 12px;background:#071a2c;border:1px solid #31536f;border-radius:10px;color:white;font-size:15px;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #32dfff18}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.action{min-height:45px;border-radius:10px;padding:11px 12px;border:1px solid #38617f;background:#0d2941;color:#e9f8ff;font-weight:900;cursor:pointer}.action.primary{background:linear-gradient(100deg,#19c9f4,#83f1ff);border:0;color:#03101a}.action.danger{border-color:#92354e;color:#ff8fa7;background:#32121f}.action.wide{grid-column:1/-1}.action:disabled{opacity:.35;filter:grayscale(.7);cursor:not-allowed}
.attack-card{border:1px solid #2e506b;border-radius:14px;padding:14px;margin:13px 0;background:#061a2b}.attack-card h3{margin:0 0 12px;font-size:15px;letter-spacing:1px}.attack-card.yellow h3{color:#ffe44d}.attack-card.purple h3{color:#d6a0ff}.attack-card.red h3{color:#ff647c}.attack-card.green h3{color:#67ffad}.attack-value{font-size:34px;font-weight:1000;text-align:center;margin:8px 0 14px;color:white}.attack-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.attack-buttons button{font-size:15px;min-height:50px}
.help{font-size:12px;line-height:1.55;color:#91abc1;margin-top:18px}#scrim{position:fixed;inset:0;z-index:19;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s}#scrim.open{opacity:1;pointer-events:auto}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@media(min-width:1500px){.robot-art{height:min(62vh,740px)}}
@media(max-width:700px){ #arena{padding:8px 7px}.status-wrap{min-height:56px;padding:6px 45px}.status{font-size:clamp(17px,4.6vw,29px);letter-spacing:1px;-webkit-text-stroke:1px #000}.gear{width:40px;height:40px;top:8px;right:8px;font-size:20px}.matchup{grid-template-columns:minmax(0,1fr) minmax(74px,.52fr) minmax(0,1fr);gap:1px}.robot-art{height:clamp(160px,37vh,340px);width:118%}.robot-name{font-size:clamp(21px,6vw,38px);letter-spacing:0;-webkit-text-stroke:1.4px #000}.attack-score{flex-direction:column;gap:8px;letter-spacing:1px;font-size:10px;margin-top:14px}.attack-score strong{font-size:clamp(48px,13vw,76px);-webkit-text-stroke:1.5px #000}.vs{font-size:clamp(35px,9vw,58px);margin-bottom:25px;-webkit-text-stroke:2.5px #000}.timer-label{font-size:8px;letter-spacing:1px;margin-bottom:9px}.timer{font-size:clamp(28px,7vw,45px);-webkit-text-stroke:2px #000}}
@media(max-height:560px) and (min-width:701px){ #arena{padding-top:4px;padding-bottom:4px}.status-wrap{min-height:34px}.status{font-size:clamp(18px,2.4vw,30px)}.robot-art{height:48vh}.vs{margin-bottom:12px}.timer-label{margin-bottom:4px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button class="gear" id="openSettings" aria-label="Abrir parámetros" title="Parámetros">⚙</button>
<div id="arena">
 <div class="status-wrap"><div class="status ready" id="status">EN PROCESO</div></div>
 <main class="matchup">
  <section class="combatant left" id="combatant1" style="--robot-color:#ffe34d"><img class="robot-art" id="robotImage1" src="/R_Amarillo.png" alt="Robot izquierdo"><div class="robot-name" id="robot1">AMARILLO</div><div class="attack-score"><span>ATAQUES</span><strong id="attacks1">0</strong></div></section>
  <section class="center"><div class="vs">VS</div><div class="timer-label">TIEMPO</div><div class="timer" id="time">00:00:00</div></section>
  <section class="combatant right" id="combatant2" style="--robot-color:#c28cff"><img class="robot-art" id="robotImage2" src="/R_Morado.png" alt="Robot derecho"><div class="robot-name" id="robot2">MORADO</div><div class="attack-score"><span>ATAQUES</span><strong id="attacks2">0</strong></div></section>
 </main><div class="winner" id="winner" hidden></div>
</div><div id="scrim"></div>
<aside id="settings" aria-label="Parámetros de batalla">
 <div class="settings-head"><h2>AJUSTES DE BATALLA</h2><button class="close" id="closeSettings" aria-label="Cerrar">×</button></div>
 <div class="tabbar"><button class="tab active" id="tabControl" type="button">CONTROL</button><button class="tab" id="tabAttacks" type="button">CONTAR ATAQUES</button></div>
 <section class="panel-section" id="controlPanel">
  <label class="field-label" for="inputRobot1">Nombre robot izquierdo</label><input id="inputRobot1" maxlength="40" value="AMARILLO">
  <label class="field-label" for="inputRobot2">Nombre robot derecho</label><input id="inputRobot2" maxlength="40" value="MORADO">
  <div class="actions"><button class="action wide" id="saveNames">Guardar nombres</button><button class="action primary" id="start">▶ Iniciar</button><button class="action" id="pause">Ⅱ Pausar</button><button class="action danger" id="finish">■ Finalizar</button><button class="action" id="next">Siguiente batalla ↗</button></div>
  <label class="field-label" for="winnerInput">Ganador (opcional)</label><input id="winnerInput" maxlength="40" placeholder="Nombre del robot ganador">
  <label class="field-label" for="reasonInput">Motivo (opcional)</label><input id="reasonInput" maxlength="80" placeholder="Ej. mayor número de ataques">
  <div class="actions"><button class="action wide" id="saveResult">Finalizar y guardar ganador</button></div>
 </section>
 <section class="panel-section" id="attacksPanel" hidden>
  <p class="help" style="margin-top:0">Los botones se habilitan únicamente cuando la batalla esté <b>EN CURSO</b>.</p>
  <div class="attack-card yellow" id="attackCard1"><h3 id="attackName1">AMARILLO</h3><div class="attack-value" id="panelAttacks1">0 ataques</div><div class="attack-buttons"><button class="action primary" id="addAttack1" disabled>＋ Sumar</button><button class="action" id="removeAttack1" disabled>− Corregir</button></div></div>
  <div class="attack-card purple" id="attackCard2"><h3 id="attackName2">MORADO</h3><div class="attack-value" id="panelAttacks2">0 ataques</div><div class="attack-buttons"><button class="action primary" id="addAttack2" disabled>＋ Sumar</button><button class="action" id="removeAttack2" disabled>− Corregir</button></div></div>
  <p class="help">Si la batalla está pausada o finalizada, no se podrán modificar los ataques.</p>
 </section>
</aside><script>const $=id=>document.getElementById(id);
async function api(path,method='GET',body=null){const opts={method,headers:{'Content-Type':'application/json'}};if(body)opts.body=JSON.stringify(body);const res=await fetch(path,opts);const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Error de comunicación');return data}
function fmt(s){s=Math.max(0,Number(s)||0);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')}
function robotColor(image,name){const src=String(image||'').toLowerCase(),n=String(name||'').toLowerCase();if(src.includes('amarillo')||n.includes('amarill'))return'#ffe34d';if(src.includes('morado')||n.includes('morado'))return'#c28cff';if(src.includes('rojo')||n.includes('rojo'))return'#ff5878';if(src.includes('verde')||n.includes('verde'))return'#63ffad';return'#f5fbff'}
function colorClass(image,name){const v=(String(image||'')+' '+String(name||'')).toLowerCase();if(v.includes('amarillo'))return'yellow';if(v.includes('morado'))return'purple';if(v.includes('rojo'))return'red';if(v.includes('verde'))return'green';return'purple'}
function render(s){
 $('robot1').textContent=s.robot1;$('robot2').textContent=s.robot2;
 $('robotImage1').src=s.robot1_image||'/R_Amarillo.png';$('robotImage2').src=s.robot2_image||'/R_Morado.png';
 $('combatant1').style.setProperty('--robot-color',robotColor(s.robot1_image,s.robot1));$('combatant2').style.setProperty('--robot-color',robotColor(s.robot2_image,s.robot2));
 $('attacks1').textContent=s.attacks1;$('attacks2').textContent=s.attacks2;$('time').textContent=fmt(s.elapsed_seconds);
 const status=$('status'),phase=s.phase||'ready';status.textContent=phase==='running'?'EN CURSO':phase==='paused'?'PAUSADO':phase==='finished'?'FINALIZADO':'EN PROCESO';
 status.classList.remove('running','paused','finished','ready');status.classList.add(phase==='running'?'running':phase==='paused'?'paused':phase==='finished'?'finished':'ready');
 $('winner').hidden=!s.winner;$('winner').textContent=s.winner?'🏆 GANADOR: '+s.winner+(s.reason?' · '+s.reason):'';
 $('attackName1').textContent=s.robot1;$('attackName2').textContent=s.robot2;$('panelAttacks1').textContent=s.attacks1+' ataques';$('panelAttacks2').textContent=s.attacks2+' ataques';
 $('attackCard1').className='attack-card '+colorClass(s.robot1_image,s.robot1);$('attackCard2').className='attack-card '+colorClass(s.robot2_image,s.robot2);
 ['addAttack1','removeAttack1','addAttack2','removeAttack2'].forEach(id=>$(id).disabled=phase!=='running');
 if(document.activeElement!==$('inputRobot1'))$('inputRobot1').value=s.robot1;if(document.activeElement!==$('inputRobot2'))$('inputRobot2').value=s.robot2;
}
function toggleSettings(open){$('settings').classList.toggle('open',open);$('scrim').classList.toggle('open',open)}
function showTab(tab){const attacks=tab==='attacks';$('controlPanel').hidden=attacks;$('attacksPanel').hidden=!attacks;$('tabControl').classList.toggle('active',!attacks);$('tabAttacks').classList.toggle('active',attacks)}
$('openSettings').addEventListener('click',()=>toggleSettings(true));$('closeSettings').addEventListener('click',()=>toggleSettings(false));$('scrim').addEventListener('click',()=>toggleSettings(false));$('tabControl').addEventListener('click',()=>showTab('control'));$('tabAttacks').addEventListener('click',()=>showTab('attacks'));document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleSettings(false)});
$('saveNames').addEventListener('click',async()=>{try{render(await api('/api/config','POST',{robot1:$('inputRobot1').value,robot2:$('inputRobot2').value}))}catch(e){alert(e.message||'No se pudieron guardar los nombres.')}});
$('start').addEventListener('click',async()=>{try{render(await api('/api/start','POST'))}catch(e){alert(e.message||'No se pudo iniciar la batalla.')}});
$('pause').addEventListener('click',async()=>{try{render(await api('/api/pause','POST'))}catch(e){alert(e.message||'No se pudo pausar la batalla.')}});
$('finish').addEventListener('click',async()=>{try{render(await api('/api/finish','POST'))}catch(e){alert(e.message||'No se pudo finalizar la batalla.')}});
$('saveResult').addEventListener('click',async()=>{try{render(await api('/api/finish','POST',{winner:$('winnerInput').value,reason:$('reasonInput').value}))}catch(e){alert(e.message||'No se pudo guardar el resultado.')}});
$('next').addEventListener('click',async()=>{try{render(await api('/api/next','POST'));$('winnerInput').value='';$('reasonInput').value='';showTab('control')}catch(e){alert(e.message||'No se pudo preparar la siguiente batalla.')}});
async function attack(robot,action){try{render(await api(action==='add'?'/api/attack/'+robot:'/api/attack/'+robot+'/decrement','POST'))}catch(e){alert(e.message||'No se pudo actualizar el contador de ataques.')}}
$('addAttack1').addEventListener('click',()=>attack(1,'add'));$('removeAttack1').addEventListener('click',()=>attack(1,'remove'));$('addAttack2').addEventListener('click',()=>attack(2,'add'));$('removeAttack2').addEventListener('click',()=>attack(2,'remove'));
async function refresh(){try{render(await api('/api/state'))}catch(e){$('status').textContent='SIN CONEXIÓN';$('status').classList.remove('running','paused','finished','ready')}}refresh();setInterval(refresh,500);</script>
</body>
</html>
